<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cerebro Digital - Axiomatic Ontology Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #030712;
      --cyan-neon: #00f5d4;
      --blue-neon: #38bdf8;
      --purple-neon: #a855f7;
      --glass-panel: rgba(11, 19, 38, 0.75);
      --border-glow: rgba(0, 245, 212, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Rajdhani', sans-serif;
      color: #e2e8f0;
      user-select: none;
    }
    
    #title-header {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 100;
      pointer-events: none;
    }
    #title-header h1 {
      margin: 0;
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 2.5px;
      background: linear-gradient(135deg, #ffffff 40%, var(--cyan-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(0, 245, 212, 0.4));
    }
    #title-header span {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--blue-neon);
      text-transform: uppercase;
      opacity: 0.8;
      font-weight: 600;
    }
    
    #graph-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Orbitron', monospace;
      color: var(--cyan-neon);
      font-size: 16px;
      letter-spacing: 3px;
      z-index: 200;
      pointer-events: none;
      text-shadow: 0 0 15px rgba(0, 245, 212, 0.6);
      animation: pulse 1.6s ease-in-out infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

    /* Buscador Holográfico */
    .search-panel {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 100;
      background: var(--glass-panel);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      padding: 8px 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 245, 212, 0.15);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search-panel input {
      padding: 8px 14px;
      width: 220px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      background: rgba(3, 7, 18, 0.7);
      color: #ffffff;
      outline: none;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .search-panel input:focus {
      border-color: var(--cyan-neon);
      box-shadow: 0 0 10px rgba(0, 245, 212, 0.3);
    }
    .search-panel button {
      padding: 8px 16px;
      background: linear-gradient(135deg, var(--cyan-neon), var(--blue-neon));
      border: none;
      color: #030712;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Orbitron', monospace;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1px;
      transition: 0.3s;
    }
    .search-panel button:hover {
      box-shadow: 0 0 16px rgba(0, 245, 212, 0.6);
      transform: translateY(-1px);
    }

    /* Tarjeta Holográfica de Nodo */
    #info-card {
      position: absolute;
      bottom: 28px;
      right: 28px;
      background: var(--glass-panel);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      padding: 18px 22px;
      width: 320px;
      display: none;
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 245, 212, 0.2);
      z-index: 100;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    #info-card h4 {
      margin: 0 0 6px 0;
      font-family: 'Orbitron', monospace;
      color: var(--cyan-neon);
      font-size: 15px;
      letter-spacing: 1px;
    }
    #info-card p {
      margin: 5px 0;
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.4;
      font-weight: 500;
    }
    #info-card .highlight { color: #f8fafc; font-weight: 700; }
    
    #echarts-radar {
      width: 100%;
      height: 160px;
      margin-top: 10px;
      border-radius: 8px;
      background: rgba(3, 7, 18, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    #btn-doc {
      display: inline-block;
      margin-top: 12px;
      color: var(--cyan-neon);
      text-decoration: none;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      border: 1px solid rgba(0, 245, 212, 0.4);
      padding: 7px 14px;
      border-radius: 6px;
      background: rgba(0, 245, 212, 0.08);
      transition: all 0.25s;
    }
    #btn-doc:hover {
      background: rgba(0, 245, 212, 0.25);
      box-shadow: 0 0 14px rgba(0, 245, 212, 0.4);
    }
  </style>

  <script src="https://unpkg.com/three@0.136.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three-spritetext@1.8.1/dist/three-spritetext.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.70.0/dist/3d-force-graph.min.js"></script>
  <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
  <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <div id="title-header">
    <h1>Cerebro Digital</h1>
    <span>Ontología Axiomática</span>
  </div>
  
  <div id="loading">SINCRONIZANDO RED NEURONAL...</div>

  <div class="search-panel">
    <input type="text" id="buscador" placeholder="Localizar nodo o concepto...">
    <button onclick="volarHaciaNodo()">ENFOCAR</button>
  </div>

  <div id="info-card">
    <h4 id="card-title">Nodo</h4>
    <p><span class="highlight">ID:</span> <span id="card-id"></span></p>
    <p><span class="highlight">Axioma:</span> <span id="card-desc"></span></p>
    <div id="echarts-radar"></div>
    <a id="btn-doc" href="#" target="_blank">FUENTE EN DRIVE ↗</a>
  </div>

  <div id="graph-container"></div>

  <script>
    let Graph;
    let myChart = null; 
    const highlightNodes = new Set();
    const highlightLinks = new Set();

    // 🌟 Paleta Sci-Fi Estética (corrige los colores primarios planos de la hoja)
    const PALETA_NEON = [
      '#00f5d4', // Cian brillante
      '#38bdf8', // Azul celeste
      '#a855f7', // Violeta orquídea
      '#f59e0b', // Ámbar dorado
      '#ec4899', // Rosa neón
      '#10b981'  // Esmeralda
    ];

    function armonizarColor(colorOriginal, id) {
      if (!colorOriginal || colorOriginal === '#ff0000' || colorOriginal === '#00ff00' || colorOriginal === '#0000ff') {
        let hash = 0;
        const str = String(id || 'default');
        for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
        return PALETA_NEON[Math.abs(hash) % PALETA_NEON.length];
      }
      return colorOriginal;
    }

    const API_URL = 'https://script.google.com/macros/s/AKfycbyKF3KUVC9HpccVUocbaHojMN8DpY4WC1gwI-fTI98-0ykiHubBbt6GMUsC6Aa7zKWqRQ/exec';

    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        prepararTopologia(data);
        renderizarGrafo(data);
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'ERROR DE CONEXIÓN: ' + err.message;
      });

    function prepararTopologia(data) {
      const counts = {};
      data.links.forEach(link => {
        const a = data.nodes.find(n => n.id === link.source);
        const b = data.nodes.find(n => n.id === link.target);
        if (a && b) {
          if (!a.neighbors) a.neighbors = [];
          if (!b.neighbors) b.neighbors = [];
          a.neighbors.push(b);
          b.neighbors.push(a);

          if (!a.links) a.links = [];
          if (!b.links) b.links = [];
          a.links.push(link);
          b.links.push(link);

          counts[link.source] = (counts[link.source] || 0) + 1;
          counts[link.target] = (counts[link.target] || 0) + 1;
        }
      });

      const maxConex = d3.max(Object.values(counts)) || 10;
      const scaleRadius = d3.scaleLinear().domain([1, maxConex]).range([6, 18]);

      data.nodes.forEach(n => {
        n.degree = counts[n.id] || 1;
        n.color = armonizarColor(n.color, n.id);
        n.val = (n.id === 'Omni-Eco' || n.name?.includes('Omnitron')) ? 22 : scaleRadius(n.degree);
      });
    }

    function renderizarGrafo(data) {
      const geoSphere = new THREE.SphereGeometry(1, 28, 28);
      const geoHalo = new THREE.SphereGeometry(1, 20, 20);

      Graph = ForceGraph3D()(document.getElementById('graph-container'))
        .graphData(data)
        .backgroundColor('#030712')
        .showNavInfo(false)
        
        // 🌟 Curvatura orbital en enlaces para eliminar rigidez
        .linkCurvature(0.18)
        .linkCurveRotation(0.25)
        .linkColor(link => {
          const hayFoco = highlightNodes.size > 0;
          return highlightLinks.has(link) ? '#00f5d4' : (hayFoco ? 'rgba(15, 23, 42, 0.2)' : 'rgba(56, 189, 248, 0.25)');
        })
        .linkOpacity(0.8)
        .linkWidth(link => highlightLinks.has(link) ? 2.0 : 1.0)
        .linkDirectionalParticles(link => highlightLinks.has(link) ? 4 : 1)
        .linkDirectionalParticleSpeed(0.004)
        .linkDirectionalParticleWidth(link => highlightLinks.has(link) ? 2.2 : 1.2)
        .linkDirectionalParticleColor(() => '#ffffff')

        // 🌟 Nodos con Núcleo Emisivo y Halo Neón Suave
        .nodeThreeObject(node => {
          const group = new THREE.Group();
          const baseColor = new THREE.Color(node.color);
          const size = node.val;
          const esRaiz = node.id === 'Omni-Eco' || node.name?.includes('Omnitron');

          // 1. Núcleo Interno
          const matSphere = new THREE.MeshLambertMaterial({
            color: baseColor,
            emissive: baseColor,
            emissiveIntensity: 0.6,
            transparent: true,
            opacity: 0.95
          });
          const meshSphere = new THREE.Mesh(geoSphere, matSphere);
          meshSphere.scale.set(size * 0.45, size * 0.45, size * 0.45);
          group.add(meshSphere);

          // 2. Halo Cósmico con Transparencia Aditiva
          const matHalo = new THREE.MeshBasicMaterial({
            color: baseColor,
            transparent: true,
            opacity: esRaiz ? 0.35 : 0.18,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide
          });
          const meshHalo = new THREE.Mesh(geoHalo, matHalo);
          meshHalo.scale.set(size * 0.9, size * 0.9, size * 0.9);
          group.add(meshHalo);

          // 3. Tipografía Flotante Limpia (Orbitron/Rajdhani)
          const sprite = new SpriteText(node.name || node.id);
          sprite.color = esRaiz ? '#ffffff' : node.color;
          sprite.textHeight = esRaiz ? 3.8 : Math.max(2.2, size * 0.3);
          sprite.position.y = size * 0.7 + 3.0;
          sprite.fontFace = "'Rajdhani', sans-serif";
          sprite.fontWeight = '700';
          sprite.strokeColor = '#030712';
          sprite.strokeWidth = 1.2;
          group.add(sprite);

          return group;
        })

        // Interacciones
        .onNodeClick(node => {
          document.getElementById('card-title').innerText = node.name;
          document.getElementById('card-id').innerText = node.id;
          document.getElementById('card-desc').innerText = node.axioma || node.ordinario || 'Axioma de base ontológica';
          
          const btnDoc = document.getElementById('btn-doc');
          if (node.url && node.url.includes('http')) {
            btnDoc.href = node.url;
            btnDoc.style.display = 'inline-block';
          } else {
            btnDoc.style.display = 'none';
          }
          
          document.getElementById('info-card').style.display = 'block';
          generarRadarECharts(node);

          highlightNodes.clear();
          highlightLinks.clear();
          highlightNodes.add(node);
          if (node.neighbors) node.neighbors.forEach(v => highlightNodes.add(v));
          if (node.links) node.links.forEach(l => highlightLinks.add(l));
          
          actualizarFiltroVisual(); 
          const distRatio = 1 + 45 / Math.hypot(node.x, node.y, node.z);
          Graph.cameraPosition({ x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }, node, 2000);
        })
        .onBackgroundClick(() => {
          document.getElementById('info-card').style.display = 'none';
          highlightNodes.clear();
          highlightLinks.clear();
          actualizarFiltroVisual();
        });

      // 🌟 Físicas Balanceadas: Mayor repulsión para evitar agrupamientos apelmazados
      Graph.d3Force('charge').strength(-380);
      Graph.d3Force('link').distance(link => {
        const esCentral = link.source.id === 'Omni-Eco' || link.target.id === 'Omni-Eco';
        return esCentral ? 170 : 80;
      });

      // 🌟 Rotación Orbital Automática Suave
      const controls = Graph.controls();
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.4;
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
    }

    function actualizarFiltroVisual() {
      const hayFoco = highlightNodes.size > 0;
      Graph.graphData().nodes.forEach(node => {
        if (node.__threeObj) {
          const enfocado = highlightNodes.has(node);
          const opacityVal = hayFoco ? (enfocado ? 1.0 : 0.08) : 0.95;
          node.__threeObj.children.forEach(child => {
            if (child.material) child.material.opacity = opacityVal;
          });
        }
      });
      Graph.linkColor(Graph.linkColor())
           .linkWidth(Graph.linkWidth())
           .linkDirectionalParticles(Graph.linkDirectionalParticles());
    }

    function generarRadarECharts(node) {
      if (!myChart) {
        myChart = echarts.init(document.getElementById('echarts-radar'));
        window.addEventListener('resize', () => myChart.resize());
      }

      const conex = node.degree || 1;
      const option = {
        radar: {
          indicator: [
            { name: 'Red', max: 15 },
            { name: 'Centralidad', max: 10 },
            { name: 'Profundidad', max: 25 },
            { name: 'Axiomas', max: 10 }
          ],
          splitArea: { show: false },
          axisLine: { lineStyle: { color: 'rgba(56, 189, 248, 0.25)' } },
          splitLine: { lineStyle: { color: 'rgba(56, 189, 248, 0.12)' } },
          axisName: { color: '#94a3b8', fontSize: 9, fontFamily: 'Rajdhani' }
        },
        series: [{
          type: 'radar',
          data: [{
            value: [conex, Math.min(conex * 1.3, 10), node.val || 10, Math.min(conex, 7)],
            name: node.id,
            areaStyle: { color: 'rgba(0, 245, 212, 0.2)' },
            lineStyle: { color: '#00f5d4', width: 1.5 },
            itemStyle: { color: '#38bdf8' }
          }]
        }]
      };
      myChart.setOption(option);
    }

    function volarHaciaNodo() {
      const texto = document.getElementById('buscador').value.toLowerCase().trim();
      if (!texto || !Graph) return;
      
      const target = Graph.graphData().nodes.find(n => 
        (n.id && n.id.toLowerCase().includes(texto)) || 
        (n.name && n.name.toLowerCase().includes(texto))
      );
      
      if (target) {
        highlightNodes.clear();
        highlightLinks.clear();
        highlightNodes.add(target);
        if (target.neighbors) target.neighbors.forEach(v => highlightNodes.add(v));
        if (target.links) target.links.forEach(l => highlightLinks.add(l));
        
        document.getElementById('card-title').innerText = target.name;
        document.getElementById('card-id').innerText = target.id;
        document.getElementById('card-desc').innerText = target.axioma || target.ordinario || 'Axioma base';
        const btnDoc = document.getElementById('btn-doc');
        if (target.url && target.url.includes('http')) {
          btnDoc.href = target.url; btnDoc.style.display = 'inline-block';
        } else {
          btnDoc.style.display = 'none';
        }
        document.getElementById('info-card').style.display = 'block';
        generarRadarECharts(target);

        actualizarFiltroVisual();
        const ratio = 1 + 45 / Math.hypot(target.x, target.y, target.z);
        Graph.cameraPosition({ x: target.x * ratio, y: target.y * ratio, z: target.z * ratio }, target, 2000);
      }
    }
    
    document.getElementById('buscador').addEventListener('keypress', e => { 
      if (e.key === 'Enter') volarHaciaNodo(); 
    });
  </script>
</body>
</html>

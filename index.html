<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cerebro Digital - Axiomatic Ontology Graph</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #07090e;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    
    #title-header {
      position: absolute;
      top: 25px;
      left: 30px;
      z-index: 100;
      color: #ffffff;
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 1.5px;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }
    
    #graph-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f5d4;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 2px;
      z-index: 200;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0, 245, 212, 0.5);
    }

    /* Buscador Holográfico */
    .search-panel {
      position: absolute;
      top: 25px;
      right: 30px;
      z-index: 100;
      background: rgba(10, 15, 24, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 245, 212, 0.15);
      display: flex;
      gap: 8px;
    }
    .search-panel input {
      padding: 6px 10px;
      width: 220px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #0d1117;
      color: #ffffff;
      outline: none;
      font-size: 13px;
    }
    .search-panel button {
      padding: 6px 12px;
      background: #00f5d4;
      border: none;
      color: #07090e;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: 0.2s;
    }
    .search-panel button:hover { background: #38bdf8; }

    /* Tarjeta Holográfica de Nodo */
    #info-card {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(10, 15, 24, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      padding: 18px 22px;
      color: #e2e8f0;
      max-width: 340px;
      display: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0, 245, 212, 0.2);
      z-index: 100;
    }
    #info-card h4 { margin: 0 0 6px 0; color: #38bdf8; font-size: 17px; font-weight: 600; }
    #info-card p { margin: 5px 0; font-size: 13px; color: #94a3b8; line-height: 1.4; }
    #info-card .highlight { color: #ffffff; font-weight: 600; }
    #btn-doc {
      display: inline-block;
      margin-top: 10px;
      color: #00f5d4;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid rgba(0, 245, 212, 0.4);
      padding: 6px 14px;
      border-radius: 4px;
      background: rgba(0, 245, 212, 0.08);
      transition: 0.2s;
    }
    #btn-doc:hover { background: rgba(0, 245, 212, 0.25); }
  </style>

  <!-- Librerías de Vanguardia para el renderizado visual avanzado -->
  <script src="https://unpkg.com/three@0.136.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three-spritetext@1.8.1/dist/three-spritetext.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.70.0/dist/3d-force-graph.min.js"></script>
</head>
<body>
  <div id="title-header">Cerebro Digital</div>
  <div id="loading">Sincronizando red neuronal...</div>

  <div class="search-panel">
    <input type="text" id="buscador" placeholder="Buscar ID o concepto...">
    <button onclick="volarHaciaNodo()">Localizar</button>
  </div>

  <div id="info-card">
    <h4 id="card-title">Nodo</h4>
    <p><span class="highlight">ID:</span> <span id="card-id"></span></p>
    <p><span class="highlight">Axioma:</span> <span id="card-desc"></span></p>
    <a id="btn-doc" href="#" target="_blank">Abrir Fuente en Drive ↗</a>
  </div>

  <div id="graph-container"></div>

  <script>
    let Graph;
    let nodoActual = null;
    const highlightNodes = new Set();
    const highlightLinks = new Set();

    // URL de tu API de Apps Script desplegada como Aplicación Web
    const API_URL = 'https://script.google.com/macros/s/TU_ID_DE_DESPLIEGUE_AQUI/exec';

    // Petición fetch en vivo al ecosistema de Google Sheets / Drive
    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        renderizarGrafo(data);
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'Error de sincronización: ' + err.message;
      });

    function limpiarColor(colorCrudo) {
      if (!colorCrudo) return '#00f5d4';
      let c = colorCrudo.toString().trim();
      if (/^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/.test(c)) return c;
      return '#00f5d4'; 
    }

    function renderizarGrafo(data) {
      // Mapeo topológico de vecinos y enlaces
      data.links.forEach(link => {
        const a = data.nodes.find(n => n.id === link.source);
        const b = data.nodes.find(n => n.id === link.target);
        if (a && b) {
          if (!a.neighbors) a.neighbors = [];
          if (!b.neighbors) b.neighbors = [];
          a.neighbors.push(b);
          b.neighbors.push(a);

          if (!a.links) a.links = [];
          if (!b.links) b.links = [];
          a.links.push(link);
          b.links.push(link);
        }
      });

      const elem = document.getElementById('graph-container');
      Graph = ForceGraph3D()(elem)
        .graphData(data)
        .backgroundColor('#07090e')
        .showNavInfo(false)
        
        // 🌟 Nodos con Estética Ontológica (Esfera + Halo Glow + Texto Flotante)
        .nodeThreeObject(node => {
          const group = new THREE.Group();
          const hexColor = limpiarColor(node.color);
          const baseColor = new THREE.Color(hexColor);
          const size = node.val || 10;

          // 1. Núcleo esférico
          const sphereGeo = new THREE.SphereGeometry(size * 0.45, 24, 24);
          const sphereMat = new THREE.MeshBasicMaterial({
            color: baseColor,
            transparent: true,
            opacity: 0.95
          });
          group.add(new THREE.Mesh(sphereGeo, sphereMat));

          // 2. Halo difuso exterior (Glow)
          const haloGeo = new THREE.SphereGeometry(size * 0.75, 16, 16);
          const haloMat = new THREE.MeshBasicMaterial({
            color: baseColor,
            transparent: true,
            opacity: 0.22,
            side: THREE.BackSide
          });
          group.add(new THREE.Mesh(haloGeo, haloMat));

          // 3. Etiqueta de texto flotante en alta nitidez
          const sprite = new SpriteText(node.name);
          sprite.color = hexColor;
          sprite.textHeight = Math.max(2.8, size * 0.38);
          sprite.position.y = size * 0.7 + 3.5;
          sprite.fontFace = 'Helvetica, Arial, sans-serif';
          group.add(sprite);

          group.__baseNode = node;
          return group;
        })

        // 🌟 Aristas Neón y Partículas Sinápticas Blancas
        .linkColor(() => '#236579')
        .linkOpacity(0.7)
        .linkWidth(1.2)
        .linkDirectionalParticles(2)
        .linkDirectionalParticleSpeed(0.005)
        .linkDirectionalParticleWidth(1.6)
        .linkDirectionalParticleColor(() => '#ffffff')

        // Interacción por Clik
        .onNodeClick(node => {
          nodoActual = node;
          document.getElementById('card-title').innerText = node.name;
          document.getElementById('card-id').innerText = node.id;
          document.getElementById('card-desc').innerText = node.axioma || node.ordinario || 'Axioma estructural base';
          
          const btnDoc = document.getElementById('btn-doc');
          if (node.url && node.url.includes('http')) {
            btnDoc.href = node.url;
            btnDoc.style.display = 'inline-block';
          } else {
            btnDoc.style.display = 'none';
          }
          document.getElementById('info-card').style.display = 'block';

          highlightNodes.clear();
          highlightLinks.clear();
          if (node) {
            highlightNodes.add(node);
            if (node.neighbors) node.neighbors.forEach(vecino => highlightNodes.add(vecino));
            if (node.links) node.links.forEach(enlace => highlightLinks.add(enlace));
          }
          actualizarFiltroVisual(); 

          const distRatio = 1 + 50 / Math.hypot(node.x, node.y, node.z);
          Graph.cameraPosition({ x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }, node, 2000);
        })
        .onBackgroundClick(() => {
          document.getElementById('info-card').style.display = 'none';
          nodoActual = null;
          highlightNodes.clear();
          highlightLinks.clear();
          actualizarFiltroVisual();
        });

      // Físicas de distribución orgánica esférica
      Graph.d3Force('charge').strength(-280);
      Graph.d3Force('link').distance(link => {
        if (link.source.id === 'Omni-Eco' || link.target.id === 'Omni-Eco') return 130;
        return 55;
      });
    }

    function actualizarFiltroVisual() {
      const hayFoco = highlightNodes.size > 0;
      Graph.graphData().nodes.forEach(node => {
        if (node.__threeObj) {
          const enfocado = highlightNodes.has(node);
          const opacityVal = hayFoco ? (enfocado ? 1.0 : 0.12) : 0.95;
          node.__threeObj.children.forEach(child => {
            if (child.material) child.material.opacity = opacityVal;
          });
        }
      });
      Graph
        .linkColor(link => highlightLinks.has(link) ? '#00f5d4' : (hayFoco ? '#0e242d' : '#236579'))
        .linkOpacity(hayFoco ? 0.9 : 0.7);
    }

    function volarHaciaNodo() {
      const texto = document.getElementById('buscador').value.toLowerCase().trim();
      if (!texto || !Graph) return;
      
      const graphData = Graph.graphData();
      const nodoEncontrado = graphData.nodes.find(n => (n.id && n.id.toLowerCase().includes(texto)) || (n.name && n.name.toLowerCase().includes(texto)));
      
      if (nodoEncontrado) {
        highlightNodes.clear();
        highlightLinks.clear();
        highlightNodes.add(nodoEncontrado);
        if (nodoEncontrado.neighbors) nodoEncontrado.neighbors.forEach(vecino => highlightNodes.add(vecino));
        if (nodoEncontrado.links) nodoEncontrado.links.forEach(enlace => highlightLinks.add(enlace));
        actualizarFiltroVisual();

        const ratio = 1 + 50 / Math.hypot(nodoEncontrado.x, nodoEncontrado.y, nodoEncontrado.z);
        Graph.cameraPosition({ x: nodoEncontrado.x * ratio, y: nodoEncontrado.y * ratio, z: nodoEncontrado.z * ratio }, nodoEncontrado, 2000);
      }
    }
    
    document.getElementById('buscador').addEventListener('keypress', function (e) { 
      if (e.key === 'Enter') volarHaciaNodo(); 
    });
  </script>
</body>
</html>
